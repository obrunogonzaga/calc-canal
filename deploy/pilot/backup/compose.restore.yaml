services:
  restore-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: restore_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/restore_password
    secrets:
      - restore_password
    tmpfs:
      - /var/lib/postgresql
    networks:
      - restore_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d restore_test"]
      interval: 2s
      timeout: 2s
      retries: 15

secrets:
  restore_password:
    file: ${RESTORE_TEST_DIR:?Set RESTORE_TEST_DIR to the disposable restore directory}/password

networks:
  restore_private:
    internal: true
